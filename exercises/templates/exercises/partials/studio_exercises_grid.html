<div class="row">
    {% for exercise in exercises %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ exercise.title }}</h5>
                <p class="card-text text-muted">{{ exercise.description|truncatewords:20 }}</p>
                <div class="mt-auto d-grid gap-2">
                    <a href="{% url 'exercises:studio' exercise.id %}" class="btn btn-dark btn-sm">Открыть студию</a>
                    <a href="{% url 'exercises:detail' exercise.id %}" class="btn btn-outline-secondary btn-sm">Открыть упражнение</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">{{ empty_message }}</div>
    </div>
    {% endfor %}
</div>
